name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI never talks to GitHub or an AI provider: tests use fixtures.
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Analysis accuracy benchmark (local fixtures, no network)
        env:
          # Gate output is disposable: canonical records under docs/ are only
          # refreshed by an explicit, reviewed run.
          BENCHMARK_OUT_DIR: ${{ runner.temp }}/benchmark
        run: npm run benchmark

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (gated live GitHub case stays skipped)
        run: npm run test:e2e

      - name: Verify tracked working tree is clean after all gates
        run: npm run release:gates -- --verify-clean

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
